plugins {
    id 'net.fabricmc.fabric-loom'
    id 'java-library'
}

// common compila contra Minecraft vanilla 26.2 + loader. NO toca APIs de loader-NeoForge.
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation project(':core')

    // SLF4J para el logger (proporcionado por loader en runtime)
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
}

loom {
    mods {
        "threedmaps-common" {
            sourceSet sourceSets.main
        }
    }
}
